plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base { archivesName = 'orbit' }

loom {
    splitEnvironmentSourceSets()
    mods {
        orbit {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

def generateOrbitIcon = tasks.register('generateOrbitIcon', Exec) {
    inputs.file('tools/generate_icon.py')
    inputs.file('tools/assets/orbit-logo.png.b64')
    outputs.file('src/main/resources/assets/orbit/icon.png')
    commandLine providers.gradleProperty('pythonExecutable').getOrElse('python3'), 'tools/generate_icon.py'
}

def generateOrbitWallpaper = tasks.register('generateOrbitWallpaper', Exec) {
    inputs.file('tools/generate_wallpaper.py')
    outputs.file('src/main/resources/assets/orbit/clouds.png')
    commandLine providers.gradleProperty('pythonExecutable').getOrElse('python3'), 'tools/generate_wallpaper.py'
}

def generateOrbitUi = tasks.register('generateOrbitUi', Exec) {
    inputs.file('tools/generate_ui.py')
    inputs.file('tools/assets/orbit-ui.ttf.b64')
    inputs.file('tools/assets/orbit-ui-bold.ttf.xz.b64')
    inputs.file('tools/assets/LICENSE')
    outputs.dir('src/main/resources/assets/orbit/textures/gui/sprites/ui')
    outputs.dir('src/main/resources/assets/orbit/font')
    commandLine providers.gradleProperty('pythonExecutable').getOrElse('python3'), 'tools/generate_ui.py'
}

processResources {
    dependsOn generateOrbitIcon, generateOrbitWallpaper, generateOrbitUi
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

// sourcesJar also reads src/main/resources, including both generated images.
tasks.named('sourcesJar') {
    dependsOn generateOrbitIcon, generateOrbitWallpaper, generateOrbitUi
}
