plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base { archivesName = 'orbit' }

loom {
    splitEnvironmentSourceSets()
    mods {
        orbit {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

def generateOrbitIcon = tasks.register('generateOrbitIcon', Exec) {
    inputs.file('tools/generate_icon.py')
    inputs.file('tools/assets/orbit-logo.png.b64')
    outputs.file('src/main/resources/assets/orbit/icon.png')
    commandLine providers.gradleProperty('pythonExecutable').getOrElse('python3'), 'tools/generate_icon.py'
}

def generateOrbitWallpaper = tasks.register('generateOrbitWallpaper', Exec) {
    inputs.file('tools/generate_wallpaper.py')
    outputs.file('src/main/resources/assets/orbit/clouds.png')
    commandLine providers.gradleProperty('pythonExecutable').getOrElse('python3'), 'tools/generate_wallpaper.py'
}

// GitHub snapshots contain text sources, never local account data or binary blobs.
// Recreate the exact pinned fonts/public key on a clean checkout before packaging.
def restoreOrbitBinaryResources = tasks.register('restoreOrbitBinaryResources', Exec) {
    inputs.files('tools/restore_binary_resources.py', 'tools/assets/orbit-ui.ttf.b64',
            'tools/assets/orbit-ui-bold.ttf.xz.b64', 'tools/assets/ely-textures-public-key.der.b64')
    outputs.files('src/main/resources/assets/orbit/font/ui.ttf',
            'src/main/resources/assets/orbit/font/ui_bold.ttf',
            'src/main/resources/assets/orbit/auth/ely-textures-public-key.der')
    commandLine providers.gradleProperty('pythonExecutable').getOrElse('python3'),
            'tools/restore_binary_resources.py'
}

// Legacy 0.4.6 generator; current font descriptions are checked in, TTFs restored above.
def generateOrbitUi = tasks.register('generateOrbitUi', Exec) {
    inputs.file('tools/generate_ui.py')
    inputs.file('tools/assets/orbit-ui.ttf.b64')
    inputs.file('tools/assets/orbit-ui-bold.ttf.xz.b64')
    inputs.file('tools/assets/LICENSE')
    outputs.dir('src/main/resources/assets/orbit/textures/gui/sprites/ui')
    outputs.dir('src/main/resources/assets/orbit/font')
    commandLine providers.gradleProperty('pythonExecutable').getOrElse('python3'), 'tools/generate_ui.py'
}

processResources {
    dependsOn generateOrbitIcon, generateOrbitWallpaper, restoreOrbitBinaryResources
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

// sourcesJar also reads src/main/resources, including both generated images.
tasks.named('sourcesJar') {
    dependsOn generateOrbitIcon, generateOrbitWallpaper, restoreOrbitBinaryResources
}
