name: Orbit - Fabric build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'tools/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build violet glass menus
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 25 for Loom (mod bytecode targets Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Check official dependency metadata
        run: python3 .github/scripts/check_dependencies.py
      - name: Test FreeLook state and config
        run: bash scripts/test-freelook.sh
      - name: Test offline profile storage
        run: bash scripts/test-profiles.sh
      - name: Check supplied logo and menu layout
        run: python3 tools/test_menu_assets.py
      - name: Test glass panel geometry
        run: python3 tools/test_glass.py
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
          cache-read-only: true
      - name: Compile and remap mod
        run: gradle --no-daemon --stacktrace build
      - name: Verify built mod metadata and mixins
        shell: python
        run: |
          import json
          import struct
          import zipfile
          from pathlib import Path
          jar = Path('build/libs/orbit-0.4.3-ui-fix.jar')
          expected = ['MainProfileMixin', 'CameraMixin', 'MouseHandlerMixin', 'TitleScreenMixin', 'MenuButtonMixin', 'CycleButtonAccessor', 'MenuBackdropMixin', 'MenuListMixin', 'MenuEditBoxMixin', 'MenuFontMixin', 'MenuSliderMixin', 'MenuScrollMixin', 'MenuCheckboxMixin', 'MenuTabMixin', 'MenuSeparatorMixin', 'MenuMessageMixin']
          with zipfile.ZipFile(jar) as archive:
              info = json.loads(archive.read('fabric.mod.json'))
              icon = archive.read(info['icon'])
              assert icon[:8] == b'\x89PNG\r\n\x1a\n', 'Missing or invalid icon'
              assert struct.unpack('>II', icon[16:24]) == (512, 512)
              wallpaper = archive.read('assets/orbit/clouds.png')
              assert wallpaper[:8] == b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II', wallpaper[16:24]) == (1600, 900)
              assert 'assets/orbit/font/ui.ttf' in archive.namelist()
              assert 'assets/orbit/font/license.txt' in archive.namelist()
              font_info = json.loads(archive.read('assets/orbit/font/ui.json'))
              namespace, font_file = font_info['providers'][0]['file'].split(':', 1)
              assert 'assets/' + namespace + '/font/' + font_file in archive.namelist(), 'Broken Minecraft TTF resource path'
              for sprite in ('surface', 'border', 'shadow', 'surface_small', 'border_small'):
                  assert 'assets/orbit/textures/gui/sprites/ui/' + sprite + '.png' in archive.namelist()
                  assert 'assets/orbit/textures/gui/sprites/ui/' + sprite + '.png.mcmeta' in archive.namelist()
              assert info['id'] == 'orbit', info
              assert info['version'] == '0.4.3-ui-fix', info
              assert info['depends']['minecraft'] == '1.21.11', info
              assert any(item['config'] == 'orbit.client.mixins.json' for item in info['mixins'])
              mixins = json.loads(archive.read('orbit.client.mixins.json'))
              assert mixins['required'] is True
              assert mixins['compatibilityLevel'] == 'JAVA_21'
              assert sorted(mixins['client']) == sorted(expected)
              required = ['dev/alacka/orbit/OrbitClient.class',
                          'dev/alacka/orbit/freelook/FreeLookController.class',
                          'dev/alacka/orbit/freelook/FreeLookState.class',
                          'dev/alacka/orbit/menu/OrbitMenu.class',
                          'dev/alacka/orbit/menu/GlassMenu.class',
                          'dev/alacka/orbit/profiles/ProfilesScreen.class',
                          'dev/alacka/orbit/profiles/ProfileStore.class',
                          'dev/alacka/orbit/profiles/ProfileLaunch.class']
              required += ['dev/alacka/orbit/mixin/' + name + '.class' for name in expected]
              for name in required:
                  assert name in archive.namelist(), name
              for name in archive.namelist():
                  if name.startswith('dev/alacka/orbit/') and name.endswith('.class'):
                      magic, minor, major = struct.unpack('>IHH', archive.read(name)[:8])
                      assert magic == 0xCAFEBABE and major == 65, (name, major)
          print('Menu/icon/FreeLook, Java 21 bytecode and Mixin metadata verified:', jar)
          print('Actual Mixin application and camera behaviour still require an in-game test.')
      - name: Upload cloud glass preview jar
        uses: actions/upload-artifact@v4
        with:
          name: orbit-1.21.11-0.4.3-ui-fix
          path: build/libs/orbit-0.4.3-ui-fix.jar
          if-no-files-found: error
          retention-days: 14
      - name: Write build result
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
        run: |
          printf '\n## Build result: %s\n\n' "$BUILD_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo 'Build JVM: Java 25. Mod bytecode target: Java 21.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Cloud glass menu and FreeLook preview. Theme editor and other planned modules are not implemented. A successful build is not an in-game test.' >> "$GITHUB_STEP_SUMMARY"
