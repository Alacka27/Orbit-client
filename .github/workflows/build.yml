name: Orbit - Fabric build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'tools/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Violet Glass UI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 25 for Loom (mod bytecode targets Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Check official dependency metadata
        run: python3 .github/scripts/check_dependencies.py
      - name: Test FreeLook state and config
        run: bash scripts/test-freelook.sh
      - name: Test modules and per-profile interface preferences
        run: bash scripts/test-modules.sh
      - name: Test responsive ClickGUI layout
        run: bash scripts/test-clickgui.sh
      - name: Test container, profile and pause layouts
        run: bash scripts/test-game-ui.sh
      - name: Test offline profile storage
        run: bash scripts/test-profiles.sh
      - name: Check supplied logo and menu layout
        run: python3 tools/test_menu_assets.py
      - name: Test glass panel geometry
        run: |
          python3 tools/test_glass.py
          python3 tools/test_ui_coverage.py
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
          cache-read-only: true
      - name: Compile and remap mod
        run: gradle --no-daemon --stacktrace build
      - name: Verify built mod metadata, fonts and GUI resources
        run: python3 tools/verify_jar.py
      - name: Upload Violet Glass jar
        uses: actions/upload-artifact@v4
        with:
          name: orbit-1.21.11-0.4.6-violet-ui
          path: build/libs/orbit-0.4.6-violet-ui.jar
          if-no-files-found: error
          retention-days: 14
      - name: Write build result
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
        run: |
          printf '\n## Build result: %s\n\n' "$BUILD_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo 'Build JVM: Java 25. Mod bytecode target: Java 21.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Violet Glass menus, theme editor, profiles, vanilla containers and HUD. Native slot geometry and gameplay callbacks are retained. A successful CI build is not an in-game test; see docs/QA_0.4.6.md for the recorded local checks.' >> "$GITHUB_STEP_SUMMARY"
